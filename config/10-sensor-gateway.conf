# /etc/ssh/sshd_config.d/10-sensor-gateway.conf - installed by harden.sh
# Keys only: a stolen or guessed password is not enough to log in.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
PermitEmptyPasswords no
# only members of this group may log in at all
AllowGroups ssh-users
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# port forwarding stays on: it is how the PC reaches the logger through an encrypted tunnel
AllowTcpForwarding local
ClientAliveInterval 300
ClientAliveCountMax 2
